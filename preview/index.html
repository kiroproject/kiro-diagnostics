<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnostics preview</title>
<style>

  /* the card of Minishop 3.8.1: the tab lives in the content area, other columns sit next to it */

  .side{flex:0 0 var(--side,0px)}
  .content{flex:1 1 auto;min-width:0;padding:16px}
</style>

<body>
<div class="shell"><div class="side"></div><div class="content" id="app"></div></div>

        { at: ago(24), ip: "123.123.123.123", app: "Happ/4.6.0/Android" },
        { at: ago(25), ip: "123.123.123.123", app: "Happ/4.6.0/Android" },
        { at: ago(45), ip: "123.123.123.123", app: "INCY/3.7.0/android Dalvik/2.1.0" },
      ],
    },
    payments: [],
  };
  const GB = 1024 ** 3;
  // ?demo=rich: an invented active subscriber, used for the README screenshots
  const rich = {
    ok: true, generated_at: new Date().toISOString(),
    warnings: [
      { level: "warn", text: "Израсходовано больше 80% Premium-трафика" },
      { level: "info", text: "Не подключался 4 дн." },
    ],
    shop: { user_id: 4821, minishop_id: "ms_0123456789abcdef0123456789abcdef", telegram_id: 100200300, username: "demo_user", registered_at: ago(60 * 24 * 41) },
    subscription: {
      tariff: "standard", active: true, end_date: new Date(Date.now() + 21 * 864e5).toISOString(), auto_renew: true,
      traffic_used: 38.4 * GB, traffic_limit: 150 * GB, premium_used: 17.2 * GB, premium_limit: 20 * GB, premium_limited: true, premium_unlimited: false,
    },
    panel: {
      status: "ACTIVE", expire_at: new Date(Date.now() + 21 * 864e5).toISOString(), online_at: ago(60 * 24 * 4), first_connected_at: ago(60 * 24 * 40),

      { created_at: ago(60 * 24 * 41), amount: 149, currency: "RUB", provider: "yookassa", funding_source: "external", status: "succeeded" },
      { created_at: ago(60 * 24 * 41), amount: 30, currency: "RUB", provider: "balance", funding_source: "balance", status: "succeeded" },
    ],
  };
  const chosen = new URLSearchParams(location.search).get("demo") === "rich" ? rich : data;
  const realFetch = window.fetch.bind(window);
  window.fetch = (url, opts) => String(url).startsWith("/api/admin/kiro-diagnostics")
    ? Promise.resolve(new Response(JSON.stringify(chosen), { status: 200, headers: { "Content-Type": "application/json" } }))
    : realFetch(url, opts);
  const side = new URLSearchParams(location.search).get("side");
  if (side) document.documentElement.style.setProperty("--side", side + "px");
  const mod = await import("../frontend/index.js?" + Date.now());
  mod.mountView("diagnostics", document.getElementById("app"), { user: { user_id: 1 }, active: true });
</script>
</body>
</html>
